---
name: Build Linux AppImage

on:
  workflow_call:
    inputs:
      release_tag:
        description: Git tag used in the published filename (for example, v1.0.0)
        required: true
        type: string
      release_version:
        description: Application version derived from the tag (for example, 1.0.0 or 1.0.0-prerelease.1)
        required: true
        type: string

permissions:
  contents: read

jobs:
  appimage:
    name: Linux x86_64 AppImage
    runs-on: ubuntu-22.04
    env:
      CI_VERSION: ${{ inputs.release_version }}
      RELEASE_ASSET: pyrolight-${{ inputs.release_tag }}-linux-x86_64.AppImage

    steps:
      - name: Check out Pyrolight
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false

      # PyroWave is vendored in Pyroshine (vendor/pyrowave: upstream plus its
      # patch series); build the decoder from that tree at a pinned commit.
      - name: Check out the vendored PyroWave
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: karsyboy/pyroshine
          ref: 4f1a90b0cc6d2d58663ee29c8a3b8a80e55f3cc2
          path: deps/pyroshine
          sparse-checkout: vendor/pyrowave
          fetch-depth: 1
          persist-credentials: false

      - name: Use the vendored PyroWave tree
        shell: bash
        run: mv deps/pyroshine/vendor/pyrowave deps/PyroWave

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://packages.lunarg.com/lunarg-signing-key-pub.asc \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/lunarg-vulkan.gpg >/dev/null
          echo 'deb [signed-by=/usr/share/keyrings/lunarg-vulkan.gpg] https://packages.lunarg.com/vulkan/1.4.313 jammy main' \
            | sudo tee /etc/apt/sources.list.d/lunarg-vulkan.list >/dev/null
          sudo apt-get update
          sudo apt-get install --yes \
            qt6-base-dev qt6-declarative-dev libqt6svg6-dev \
            qml6-module-qtquick-controls qml6-module-qtquick-templates \
            qml6-module-qtquick-layouts qml6-module-qtqml-workerscript \
            qml6-module-qtquick-window qml6-module-qtquick python3-pip nasm \
            libgbm-dev libdrm-dev libfreetype-dev libasound2-dev libdbus-1-dev \
            libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev libglu1-mesa-dev \
            libibus-1.0-dev libpulse-dev libudev-dev libx11-dev libxcursor-dev \
            libxext-dev libxi-dev libxinerama-dev libxkbcommon-dev libxrandr-dev \
            libxss-dev libxt-dev libxv-dev libxxf86vm-dev libxcb-dri3-dev libxau-dev \
            libx11-xcb-dev libxfixes-dev libxtst-dev wayland-protocols libopus-dev \
            libvdpau-dev libgl-dev libpipewire-0.3-dev liburing-dev vulkan-sdk cmake \
            libwayland-dev libdecor-0-dev qt6-wayland
          python3 -m pip install --user meson
          mkdir -p dep_root/bin
          echo "$(python3 -m site --user-base)/bin" >> "${GITHUB_PATH}"
          echo "${PWD}/dep_root/bin" >> "${GITHUB_PATH}"

      - name: Check out SDL3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: libsdl-org/SDL
          ref: release-3.4.18
          path: deps/SDL
          persist-credentials: false

      - name: Build SDL3
        working-directory: deps/SDL
        run: |
          set -euo pipefail
          cmake -DSDL_KMSDRM=OFF -DSDL_WAYLAND=ON -DSDL_WAYLAND_LIBDECOR=ON -DSDL_X11=ON -DSDL_TEST_LIBRARY=OFF -DSDL_INSTALL_DOCS=OFF -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON -S . -B build
          # SDL silently drops video drivers whose dependencies are missing
          for driver in SDL_VIDEO_DRIVER_WAYLAND SDL_VIDEO_DRIVER_WAYLAND_DYNAMIC_LIBDECOR SDL_VIDEO_DRIVER_X11; do
            grep -q "^#define ${driver} " build/include-config-*/build_config/SDL_build_config.h || { echo "SDL3 was configured without ${driver}"; exit 1; }
          done
          cmake --build build --parallel
          sudo cmake --install build

      - name: Check out sdl2-compat
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: libsdl-org/sdl2-compat
          ref: release-2.32.74
          path: deps/sdl2-compat
          persist-credentials: false

      - name: Build sdl2-compat
        working-directory: deps/sdl2-compat
        run: |
          cmake -DSDL2COMPAT_TESTS=OFF -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON -S . -B build
          cmake --build build --parallel
          sudo cmake --install build

      - name: Check out SDL_ttf
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: libsdl-org/SDL_ttf
          ref: a883e490e30fb44a5336ea3dcb990c6982c5216f
          path: deps/SDL_ttf
          submodules: recursive
          persist-credentials: false

      - name: Build SDL_ttf
        working-directory: deps/SDL_ttf
        run: |
          ./autogen.sh
          ./configure
          make -j"$(nproc)"
          sudo make install

      - name: Check out libva
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: intel/libva
          ref: 2.24.1
          path: deps/libva
          persist-credentials: false

      - name: Build libva
        working-directory: deps/libva
        run: |
          ./autogen.sh
          ./configure --enable-x11=yes --enable-glx=no --enable-drm=no --enable-wayland=yes
          make -j"$(nproc)"
          sudo make install

      - name: Check out libplacebo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: haasn/libplacebo
          ref: 92b5ac6db79f4d680eb656692f7bf51e9606f42a
          path: deps/libplacebo
          submodules: recursive
          persist-credentials: false

      - name: Build libplacebo
        working-directory: deps/libplacebo
        run: |
          set -euo pipefail
          git apply ../../app/deploy/linux/appimage/*.patch
          meson setup build -Dvulkan=enabled -Dopengl=disabled -Ddemos=false
          ninja -C build
          # Meson is installed in the runner user's Python site. Running the
          # Ninja install target under sudo disables that site and makes the
          # generated Meson entry point fail to import mesonbuild. Stage the
          # install as the runner user, then copy it into /usr/local as root.
          meson install -C build --no-rebuild --destdir "${PWD}/install-root"
          test -d "${PWD}/install-root/usr/local"
          sudo cp -a "${PWD}/install-root/usr/local/." /usr/local/

      - name: Build dav1d
        working-directory: deps
        env:
          DAV1D_VERSION: 1.5.4
        run: |
          set -euo pipefail
          git clone --branch "${DAV1D_VERSION}" --depth 1 https://code.videolan.org/videolan/dav1d.git
          meson setup dav1d/build dav1d -Ddefault_library=static -Dbuildtype=release -Denable_tools=false -Denable_tests=false
          ninja -C dav1d/build
          meson install -C dav1d/build --no-rebuild --destdir "${PWD}/dav1d-install-root"
          test -d "${PWD}/dav1d-install-root/usr/local"
          sudo cp -a "${PWD}/dav1d-install-root/usr/local/." /usr/local/

      - name: Check out FFmpeg
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: FFmpeg/FFmpeg
          ref: n9.0.2
          path: deps/FFmpeg
          persist-credentials: false

      - name: Build FFmpeg
        working-directory: deps/FFmpeg
        run: |
          ./configure --enable-pic --enable-lto --disable-static --enable-shared --disable-all --disable-autodetect \
            --enable-avcodec --enable-avformat --enable-swscale \
            --enable-decoder=h264 --enable-decoder=hevc --enable-decoder=av1 \
            --enable-vaapi --enable-hwaccel=h264_vaapi --enable-hwaccel=hevc_vaapi --enable-hwaccel=av1_vaapi \
            --enable-vdpau --enable-hwaccel=h264_vdpau --enable-hwaccel=hevc_vdpau --enable-hwaccel=av1_vdpau \
            --enable-libdrm --enable-vulkan --enable-hwaccel=h264_vulkan --enable-hwaccel=hevc_vulkan --enable-hwaccel=av1_vulkan \
            --enable-libdav1d --enable-decoder=libdav1d
          make -j"$(nproc)"
          sudo make install

      - name: Install linuxdeploy
        working-directory: dep_root/bin
        run: |
          curl --fail --location --remote-name https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage
          curl --fail --location --remote-name https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/1-alpha-20250213-1/linuxdeploy-plugin-qt-x86_64.AppImage
          echo 'c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d  linuxdeploy-x86_64.AppImage' | sha256sum --check --strict
          echo '15106be885c1c48a021198e7e1e9a48ce9d02a86dd0a1848f00bdbf3c1c92724  linuxdeploy-plugin-qt-x86_64.AppImage' | sha256sum --check --strict
          chmod +x linuxdeploy*.AppImage

      - name: Build the PyroWave AppImage
        env:
          PYROWAVE_SOURCE: ${{ github.workspace }}/deps/PyroWave
        run: |
          sudo ldconfig
          scripts/build-pyrowave-appimage.sh

      - name: Verify and name the release asset
        shell: bash
        run: |
          set -euo pipefail
          source_asset="build/installer-release/Pyrolight-${CI_VERSION}-x86_64.AppImage"
          test -s "${source_asset}"
          chmod +x "${source_asset}"
          "${source_asset}" --appimage-extract >/dev/null
          readelf -d squashfs-root/usr/bin/pyrolight | grep -F 'libpyrowave-shared.so.1'
          find squashfs-root -type f -name 'libpyrowave-shared.so*' -print -quit | grep -F 'libpyrowave-shared.so'
          test -s squashfs-root/usr/share/licenses/pyrolight/Pyrolight-LICENSE
          test -s squashfs-root/usr/share/licenses/pyrolight/PyroWave-LICENSE
          scripts/check-appimage-display-backends.sh squashfs-root
          scripts/check-linux-icons.sh squashfs-root
          mv "${source_asset}" "build/installer-release/${RELEASE_ASSET}"

      - name: Install nfpm
        working-directory: dep_root/bin
        run: |
          set -euo pipefail
          curl --fail --location --remote-name https://github.com/goreleaser/nfpm/releases/download/v2.47.0/nfpm_2.47.0_Linux_x86_64.tar.gz
          echo '0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783  nfpm_2.47.0_Linux_x86_64.tar.gz' | sha256sum --check --strict
          tar xzf nfpm_2.47.0_Linux_x86_64.tar.gz nfpm
          rm nfpm_2.47.0_Linux_x86_64.tar.gz

      - name: Build the .deb, .rpm and Arch packages
        shell: bash
        run: |
          set -euo pipefail
          # Built from the verified AppImage payload, next to the AppImage.
          VERSION="${CI_VERSION}" scripts/build-linux-packages.sh squashfs-root build/installer-release
          ls -l build/installer-release

      - name: Upload Linux release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: pyrolight-${{ inputs.release_tag }}-linux-x86_64
          path: |
            build/installer-release/${{ env.RELEASE_ASSET }}
            build/installer-release/pyrolight_*.deb
            build/installer-release/pyrolight-*.rpm
            build/installer-release/pyrolight-*.pkg.tar.zst
          compression-level: 0
          if-no-files-found: error
