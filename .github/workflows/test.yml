name: present-wait layer test
on: { push: { branches: [ci-present-wait-test] } }
jobs:
  test:
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers vulkan-tools xvfb
      - name: install layer
        run: |
          mkdir -p ~/.local/share/vulkan/implicit_layer.d
          cat > ~/.local/share/vulkan/implicit_layer.d/pw.json <<JSON
          {"file_format_version":"1.0.0","layer":{"name":"VK_LAYER_DROIDDECK_present_wait","type":"GLOBAL",
           "library_path":"$PWD/layer/libVkLayer_droiddeck_present_wait.so","api_version":"1.3.0",
           "implementation_version":"1","description":"test","disable_environment":{"DROIDDECK_PRESENT_WAIT":"0"}}}
          JSON
      - name: vulkaninfo with the layer
        run: VK_LOADER_DEBUG=layer vulkaninfo --summary 2>&1 | grep -E "present_wait|GPU|deviceName|ERROR" | head -30
      - name: not listed -> off
        run: |
          timeout 120 xvfb-run -a vkcube --c 3000 2>&1 | grep "present-wait" | head -3
      - name: listed in the file -> on
        run: |
          sudo mkdir -p /storage/emulated/0/Download && sudo chmod -R 777 /storage
          printf '# test\nsomething-else\n  VKCUBE  \n' > /storage/emulated/0/Download/droiddeck-present-wait.txt
          timeout 120 xvfb-run -a vkcube --c 9000 2>&1 | grep "present-wait" | head -3
      - name: env 1 -> on for everything
        run: |
          rm -f /storage/emulated/0/Download/droiddeck-present-wait.txt
          DROIDDECK_PRESENT_WAIT=1 timeout 120 xvfb-run -a vkcube --c 9000 2>&1 | grep "present-wait" | head -3
      - name: env 0 -> layer not loaded
        run: |
          DROIDDECK_PRESENT_WAIT=0 VK_LOADER_DEBUG=layer timeout 120 xvfb-run -a vkcube --c 300 2>&1 | grep -c "present_wait" || echo "not loaded, as expected"
