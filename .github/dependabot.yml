# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Submodule updates follow each submodule's default branch; for
# moonlight-common-c that is the karsyboy fork's master. Upstream
# moonlight-common-c changes are tracked by the "Watch upstream
# moonlight-common-c" workflow, since they must land in the fork first.

version: 2
updates:
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: "daily"

  # Workflows pin actions by commit SHA with a version comment; Dependabot
  # updates both.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns: ["*"]
